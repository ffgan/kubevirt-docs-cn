name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install mkdocs mkdocs-awesome-nav mkdocs-material mkdocs-redirects
      - name: Point site_url at this GitHub Pages site
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          if repo.lower() == f"{owner.lower()}.github.io":
              url = f"https://{owner}.github.io/"
          else:
              url = f"https://{owner}.github.io/{repo}/"
          path = Path("mkdocs.yml")
          lines = []
          for line in path.read_text().splitlines(True):
              if line.startswith("site_url:"):
                  lines.append(f"site_url: {url}\n")
              else:
                  lines.append(line)
          path.write_text("".join(lines))
          print(url)
          PY
      - name: Build site
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
